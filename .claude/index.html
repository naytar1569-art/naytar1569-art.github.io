<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LamthongBBQ Stock">
  <link rel="manifest" href="manifest.webmanifest">
  <title>ระบบสต็อก LamthongBBQ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginOverlay" class="overlay">
    <div class="auth-card">
      <h1>เข้าสู่ระบบ</h1>
      <p>เข้าสู่ระบบเพื่อแยกสิทธิ์ผู้ดูแลระบบและพนักงาน</p>
      <label>
        อีเมล
        <input id="loginEmail" type="email" placeholder="admin@bbq.com" autocomplete="username">
      </label>
      <label>
        รหัสผ่าน
        <input id="loginPassword" type="password" placeholder="admin123" autocomplete="current-password">
      </label>
      <div class="auth-actions">
        <button id="loginBtn">เข้าสู่ระบบ</button>
      </div>
      <p class="auth-note">ตัวอย่างผู้ใช้: admin@bbq.com / admin123 หรือ staff@bbq.com / staff123</p>
    </div>
  </div>

  <header>
    <div>
      <h1>ระบบสต็อก LamthongBBQ</h1>
      <p id="loginStatus">กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
    </div>
    <div class="header-actions">
      <button id="logoutBtn" class="secondary hidden">ออกจากระบบ</button>
    </div>
  </header>

  <main>
    <section class="top-tabs" id="categoryTabs"></section>

    <section class="overview">
      <div>
        <strong>วันที่รายงาน</strong>
        <input id="reportDate" type="date">
      </div>
      <div>
        <strong>สิทธิ์ผู้ใช้</strong>
        <span id="roleLabel">ยังไม่ได้เข้าสู่ระบบ</span>
      </div>
      <div class="save-group">
        <button id="saveReportBtn">บันทึกรายงาน</button>
      </div>
    </section>

    <section id="categoryView" class="category-view"></section>
  </main>

  <template id="categoryTemplate">
    <article class="category-card">
      <header>
        <div>
          <h2 class="category-title"></h2>
          <p class="category-summary"></p>
        </div>
        <button class="addItemBtn">+ เพิ่มรายการ</button>
      </header>
      <div class="items"></div>
      <div class="add-item-form hidden">
        <div class="form-row">
          <label>
            ชื่อรายการ
            <input class="itemNameInput" type="text" placeholder="เช่น น้ำดื่ม">
          </label>
          <label>
            หน่วย
            <input class="itemUnitInput" type="text" placeholder="เช่น ขวด">
          </label>
          <label>
            จำนวนเริ่มต้น
            <input class="itemQtyInput" type="number" min="0" value="1">
          </label>
        </div>
        <div class="modal-actions">
          <button class="saveItemBtn">บันทึกรายการ</button>
          <button class="cancelItemBtn secondary">ยกเลิก</button>
        </div>
      </div>
    </article>
  </template>

  <template id="itemTemplate">
    <div class="item-card">
      <div class="item-details">
        <div>
          <strong class="item-name"></strong>
          <div class="item-unit"></div>
        </div>
        <div class="item-qty-wrapper">
          <button class="qtyBtn dec">-</button>
          <span class="item-qty"></span>
          <button class="qtyBtn inc">+</button>
        </div>
      </div>
      <div class="item-actions">
        <button class="editItemBtn secondary">แก้ไข</button>
        <button class="deleteItemBtn secondary">ลบ</button>
      </div>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
