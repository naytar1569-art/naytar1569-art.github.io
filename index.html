<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LamthongBBQ Stock">
  <link rel="manifest" href="manifest.webmanifest">
  <title>ระบบสต็อก LamthongBBQ</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body>

  <!-- Login Overlay -->
  <div id="loginOverlay" class="overlay">
    <div class="auth-card">
      <div class="auth-logo">🍖</div>
      <h1>LamthongBBQ</h1>
      <p class="auth-subtitle">ระบบจัดการสต็อกสินค้า</p>
      <div id="gSignInBtn"></div>
      <p class="auth-note">สำหรับผู้ที่ได้รับอนุญาตเท่านั้น</p>
    </div>
  </div>

  <!-- Unauthorized Overlay -->
  <div id="unauthorizedOverlay" class="overlay hidden">
    <div class="auth-card">
      <div class="auth-logo">🚫</div>
      <h1>ไม่มีสิทธิ์เข้าถึง</h1>
      <p class="auth-subtitle">อีเมลนี้ไม่ได้รับอนุญาตให้ใช้งาน</p>
      <p id="unauthorizedEmail" class="auth-note"></p>
      <p class="auth-note">ติดต่อผู้ดูแลระบบเพื่อขอสิทธิ์</p>
      <button id="unauthorizedLogoutBtn" class="btn-secondary" style="margin-top:20px;width:100%">กลับไปหน้า Login</button>
    </div>
  </div>

  <!-- Edit Item Modal -->
  <div id="editModal" class="overlay hidden">
    <div class="modal-card">
      <h2>✏️ แก้ไขรายการ</h2>
      <div class="edit-modal-form">
        <label>ชื่อสินค้า<input id="editName" type="text" placeholder="เช่น หมูสามชั้น"></label>
        <label>หน่วย<input id="editUnit" type="text" placeholder="เช่น กก."></label>
        <label>จำนวน<input id="editQty" type="number" min="0" step="1"></label>
      </div>
      <div class="modal-actions">
        <button id="saveEditBtn" class="btn-primary">บันทึก</button>
        <button id="cancelEditBtn" class="btn-secondary">ยกเลิก</button>
      </div>
    </div>
  </div>

  <!-- Staff Management Modal -->
  <div id="staffModal" class="overlay hidden">
    <div class="modal-card">
      <h2>👥 จัดการพนักงาน</h2>
      <p class="modal-desc">เพิ่ม Gmail ของพนักงานเพื่อให้สามารถเข้าสู่ระบบได้</p>
      <div id="staffList" class="staff-list"></div>
      <div class="add-staff-row">
        <input id="staffEmailInput" type="email" placeholder="staff@gmail.com">
        <button id="addStaffBtn" class="btn-primary">+ เพิ่ม</button>
      </div>
      <div class="modal-actions">
        <button id="closeStaffModal" class="btn-secondary">ปิด</button>
      </div>
    </div>
  </div>

  <!-- App Header -->
  <header id="appHeader" class="hidden">
    <div class="header-brand">
      <span class="brand-icon">🍖</span>
      <div>
        <h1>LamthongBBQ</h1>
        <p class="header-subtitle">ระบบสต็อกสินค้า</p>
      </div>
    </div>
    <div class="header-user">
      <img id="userAvatar" class="avatar hidden" src="" alt="avatar">
      <div class="user-info">
        <strong id="userName"></strong>
        <span id="roleLabel" class="role-badge"></span>
      </div>
      <button id="logoutBtn" class="logout-btn">ออกจากระบบ</button>
    </div>
  </header>

  <!-- App Content -->
  <div id="appContent" class="hidden">
    <nav class="category-nav" aria-label="หมวดหมู่">
      <div class="tabs-track" id="categoryTabs"></div>
    </nav>
    <div class="overview-bar">
      <label class="date-label">
        <span>📅</span>
        <span class="date-text">วันที่รายงาน</span>
        <input id="reportDate" type="date" aria-label="วันที่รายงาน">
      </label>
      <div class="overview-actions">
        <button id="manageStaffBtn" class="btn-outline admin-only hidden">👥 จัดการพนักงาน</button>
        <button id="saveReportBtn" class="save-btn">💾 บันทึกรายงาน</button>
      </div>
    </div>
    <main id="categoryView"></main>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="https://accounts.google.com/gsi/client" async onload="onGoogleLibLoaded()"></script>
  <script src="script.js"></script>
</body>
</html>
