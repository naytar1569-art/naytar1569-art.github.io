<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LamthongBBQ Stock">
  <link rel="manifest" href="manifest.webmanifest">
  <title>ระบบสต็อก LamthongBBQ</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body>

  <!-- Login Overlay -->
  <div id="loginOverlay" class="overlay">
    <div class="auth-card">
      <div class="auth-logo">🍖</div>
      <h1>LamthongBBQ</h1>
      <p class="auth-subtitle">ระบบจัดการสต็อกสินค้า</p>
      <div class="login-form">
        <input id="passcodeInput" type="password" placeholder="กรอกรหัสผ่าน" autocomplete="current-password">
        <button id="loginBtn" class="btn-primary login-btn">เข้าสู่ระบบ</button>
        <p id="loginError" class="login-error hidden">รหัสผ่านไม่ถูกต้อง</p>
      </div>
      <p class="auth-note">สำหรับผู้ที่ได้รับอนุญาตเท่านั้น</p>
    </div>
  </div>

  <!-- Edit Item Modal (Admin only) -->
  <div id="editModal" class="overlay hidden">
    <div class="modal-card">
      <h2>✏️ แก้ไขรายการ</h2>
      <div class="edit-modal-form">
        <label>ชื่อสินค้า<input id="editName" type="text" placeholder="เช่น หมูสามชั้น"></label>
        <label>หน่วย<input id="editUnit" type="text" placeholder="เช่น กก."></label>
        <label>จำนวน<input id="editQty" type="number" min="0" step="1"></label>
      </div>
      <div class="modal-actions">
        <button id="saveEditBtn" class="btn-primary">บันทึก</button>
        <button id="cancelEditBtn" class="btn-secondary">ยกเลิก</button>
      </div>
    </div>
  </div>

  <!-- App Header -->
  <header id="appHeader" class="hidden">
    <div class="header-brand">
      <span class="brand-icon">🍖</span>
      <div>
        <h1>LamthongBBQ</h1>
        <p class="header-subtitle">ระบบสต็อกสินค้า</p>
      </div>
    </div>
    <div class="header-user">
      <div class="user-info">
        <strong id="userName"></strong>
        <span id="roleLabel" class="role-badge"></span>
      </div>
      <button id="logoutBtn" class="logout-btn">ออกจากระบบ</button>
    </div>
  </header>

  <!-- Category Navigation -->
  <nav id="categoryNav" class="category-nav hidden" aria-label="หมวดหมู่">
    <div class="tabs-track" id="categoryTabs"></div>
  </nav>

  <!-- App Content -->
  <div id="appContent" class="hidden">
    <div class="overview-bar">
      <label class="date-label">
        <span>📅</span>
        <span class="date-text">วันที่รายงาน</span>
        <input id="reportDate" type="date" aria-label="วันที่รายงาน">
      </label>
      <div class="overview-actions">
        <button id="saveReportBtn" class="save-btn">💾 บันทึกรายงาน</button>
      </div>
    </div>
    <div id="loadingIndicator" class="loading-indicator">
      <div class="loading-spinner"></div>
      <p>กำลังโหลดข้อมูล...</p>
    </div>
    <main id="categoryView"></main>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
</html>
